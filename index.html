<!doctype html><html lang="en"><head><meta charset="utf-8"><title>ERA CM Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/xlsx.full.min.js"></script>
<style>
:root{--bg:#EEF1F6;--card:#fff;--ink:#14202F;--mut:#64748B;--line:#E1E6EE;--soft:#F5F7FB;--side:#101B2D;--acc:#2F6BFF;--ok:#12A36B;--wa:#E58A00;--er:#E5484D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1320;--card:#131E30;--ink:#E7EDF7;--mut:#8FA0B8;--line:#22314A;--soft:#0F192A;--side:#070D18;--acc:#5B8CFF}}
:root[data-theme="dark"]{--bg:#0B1320;--card:#131E30;--ink:#E7EDF7;--mut:#8FA0B8;--line:#22314A;--soft:#0F192A;--side:#070D18;--acc:#5B8CFF}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Instrument Sans',system-ui,sans-serif}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;margin:0;letter-spacing:-.01em}
#app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--side);color:#C9D4E6;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;padding:4px 10px 18px;color:#fff}.logo b{font:700 17px 'Bricolage Grotesque'}
.bars{display:flex;gap:3px;align-items:flex-end;height:22px}.bars i{width:5px;background:var(--acc);border-radius:2px}
aside a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;cursor:pointer;color:#B6C3D9}
aside a:hover{background:#ffffff14}aside a.on{background:var(--acc);color:#fff}
main{padding:22px 26px;min-width:0}
.top{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.top .grow{flex:1;position:relative;min-width:220px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.d{color:var(--er)}.btn.s{padding:4px 10px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-left:4px solid var(--acc)}
.kpi small{color:var(--mut)}.kpi b{display:block;font:700 30px 'Bricolage Grotesque';line-height:1.1;margin-top:4px}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}.g3{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#101B2D,#17305C);color:#fff;border:0}.hero small{color:#A9BAD6}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line)}tr.c{cursor:pointer}tr.c:hover td{background:var(--soft)}
.tw{overflow-x:auto}.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft)}
.ok{color:var(--ok);background:#12A36B1f}.wa{color:var(--wa);background:#E58A001f}.er{color:var(--er);background:#E5484D1f}.ac{color:var(--acc);background:#2F6BFF1f}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:0;background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:99px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer}.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:10px;border-radius:5px;display:flex;overflow:hidden;background:var(--soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.mut{color:var(--mut)}.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}.f .w{grid-column:1/3}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}#modal.on{display:flex}
#modal>div{background:var(--card);border-radius:16px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}
#drawer{position:fixed;top:0;right:-440px;width:min(420px,100%);height:100%;background:var(--card);border-left:1px solid var(--line);z-index:40;padding:22px;overflow:auto;transition:right .25s;box-shadow:-10px 0 30px #0003}#drawer.on{right:0}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;display:none;z-index:99}
#bell{position:absolute;right:0;top:46px;width:340px;max-width:92vw;z-index:30;display:none;max-height:60vh;overflow:auto}
.n{padding:10px;border-bottom:1px solid var(--line)}.n.u{background:#2F6BFF12}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .l{background:linear-gradient(150deg,#0C1626,#1B3A74);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login .r{display:flex;align-items:center;justify-content:center;padding:24px}.login .r>div{width:min(380px,100%)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
@media(max-width:860px){#app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow-x:auto;gap:4px}aside .logo{display:none}aside a{white-space:nowrap}.g2,.g3,.login{grid-template-columns:1fr}.login .l{display:none}main{padding:14px}}
.cmw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px}.cmt{min-width:1700px}.cmt th{position:sticky;top:0;background:var(--card);z-index:2;cursor:pointer;padding:11px 12px;border-bottom:2px solid var(--line);user-select:none}.cmt th:hover{color:var(--ink)}.cmt td{white-space:nowrap;padding:11px 12px}.cmt td.cm{white-space:normal;min-width:240px;max-width:380px}.cmt tr:nth-child(even) td{background:var(--soft)}.cmt tr.c:hover td{background:#2F6BFF14}
#sr{position:absolute;top:46px;left:0;right:0;z-index:30;display:none;max-height:60vh;overflow:auto;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px #0003}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="root"></div><div id="modal"></div><div id="drawer"></div><div id="toast"></div>
<script>
const DAY=864e5,NOW=Date.now();
const $=s=>document.querySelector(s),fd=t=>new Date(t).toISOString().slice(0,10),hrs=t=>Math.floor((Date.now()-t)/36e5);
const RA={Down:['MW Issue','Fiber TX Issue','PowerTel','Denyo','Power Problem','Commercial Power Cuts','DG Problem','Theft Issue','RAN Issue'],Cells:['Down Cells','Down Cells (BO)','Down Cells (RF)','Instability','Theft Issue'],Survey:['Power','Telecom','Theft Issue','FSMF','RF','BO'],Planned:['Planned']};
const AFT=['UP & CLEARED','UP BUT NOT CLEAR','DOWN'];
let TEAMS=['Abanoub','Abdallah Shappan','Alamen Ahmed','Ali Essam','Bekheet','Denyo','DG Owned','Emad','Eslam Nabil','Eslam Nasr','Khodarey','M.Abdelmonam','M.Abeed','M.Fathy','Mohamed Ashour','PowerTel','Ramy Nasr','Shappan Raslan'];
const REG=['Cairo','Giza','Alexandria','Delta','Upper Egypt'];
let S=[];
let V=[];
let TH=[];
let pull=0,FC=[];
let FD=[];
let IN=[];
let U=[];
let AUD=[],LOGS=[],SNAP={},lastLoad=0,READ=new Set(),PEOPLE=[],NT=[],DC=[],me=null,page='home',tab=0,idle,NOTE='';
const log=(a,d)=>AUD.unshift({t:Date.now(),u:me?me.name:'-',a,d});
const ed=()=>me&&['Admin','Manager','Coordinator'].includes(me.role),adm=()=>me.role=='Admin';
const lv=id=>V.filter(v=>v.site==id).sort((a,b)=>b.ts-a.ts),wk=(a,b)=>V.filter(v=>v.ts>NOW-a*DAY&&v.ts<=NOW-b*DAY);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)};
const modal=h=>{$('#modal').innerHTML='<div>'+h+'</div>';$('#modal').classList.add('on')},closeM=()=>$('#modal').classList.remove('on');
$('#modal').onclick=e=>{if(e.target.id=='modal')closeM()};
const pill=(t,c)=>`<span class="pill ${c}">${t}</span>`,st=s=>pill(s,s=='Pending'?'wa':'ok'),aft=a=>a?pill(String(a).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])),a=='UP & CLEARED'?'ok':a=='DOWN'?'er':'wa'):'\u2014';
const ageP=t=>{const h=hrs(t);return pill(h<24?h+'h':Math.floor(h/24)+'d '+h%24+'h',h<24?'ok':h<48?'wa':'er')};
const opts=(a,sel)=>a.map(x=>`<option ${x==sel?'selected':''}>${x}</option>`).join('');
function dl(fn,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove()}
async function ex(name,rows){if(!rows.length)return toast('Nothing to export');let blob,fn;
 if(window.XLSX){const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(rows),'Data');blob=new Blob([XLSX.write(w,{type:'array',bookType:'xlsx'})]);fn=name+'.xlsx'}
 else{const k=Object.keys(rows[0]);blob=new Blob(['\ufeff'+[k.join(','),...rows.map(r=>k.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))].join('\n')]);fn=name+'.csv'}
 dl(fn,blob);toast('Exported '+rows.length+' rows')}
function readXl(f,cb){const r=new FileReader();r.onload=()=>{let rows;try{const w=XLSX.read(r.result,{type:'array',cellDates:true});let ws=w.Sheets[w.SheetNames[0]];for(const n of w.SheetNames){const x=w.Sheets[n];if(!x||!x['!ref'])continue;const rg=XLSX.utils.decode_range(x['!ref']);let ok=false;for(let c=rg.s.c;c<=Math.min(rg.e.c,80);c++){const cell=x[XLSX.utils.encode_cell({r:rg.s.r,c})];if(cell&&/^\s*site/i.test(String(cell.v))){ok=true;break}}if(ok){ws=x;break}}const g0=XLSX.utils.decode_range(ws['!ref']);if(g0.e.c>200){g0.e.c=200;ws['!ref']=XLSX.utils.encode_range(g0)}rows=XLSX.utils.sheet_to_json(ws,{defval:''})}catch(e){return toast('Could not read the file')}cb(rows)};r.readAsArrayBuffer(f)}
const col=(o,re)=>{const k=Object.keys(o).find(k=>re.test(k));return k?o[k]:''};
const cmRows=a=>a.map(v=>({Site:v.site,Date:fd(v.ts),Team:v.team,Reason:v.reason,Action:v.action,Alarm:v.alarm,SubAction:v.sub,Comments:v.comments,Status:v.status,'After visited':v.after,'Power source':v.power,'Closed date':v.closed?fd(v.closed):''}));
function flapState(site,at){const l=lv(site).filter(v=>v.ts>(at||pull));if(!l.length)return['Needs Action','er'];return l[0].after=='UP & CLEARED'?['Cleared','ok']:['Visited, still flapping','wa']}
function notes(){const n=[],pu=U.filter(u=>u.status=='Pending');pu.forEach(u=>n.push({id:'u'+u.id,m:u.name+' registered and waits for approval',r:['Admin','Manager'],c:'ac'}));
 V.filter(v=>v.status=='Pending'&&hrs(v.ts)>48).slice(0,4).forEach(v=>n.push({id:'p'+v.id,m:v.site+' has been Pending for '+Math.floor(hrs(v.ts)/24)+' days',r:['Admin','Manager','Coordinator'],c:'er',s:v.site}));
 wk(7,0).filter(v=>v.action=='Fiber TX Issue').slice(0,2).forEach(v=>n.push({id:'f'+v.id,m:'Fiber down at '+v.site,r:['Admin','Manager','Coordinator'],c:'wa',s:v.site}));
 wk(7,0).filter(v=>v.action=='Theft Issue').slice(0,2).forEach(v=>n.push({id:'t'+v.id,m:'Theft issue reported at '+v.site,r:['Admin','Manager'],c:'er',s:v.site}));
 FC.filter(c=>flapState(c.site,c.at)[0]=='Needs Action').slice(0,2).forEach(c=>n.push({id:'c'+c.cell,m:'Cell '+c.cell+' is flapping with no action',r:['Admin','Coordinator'],c:'wa',s:c.site}));
 DC.filter(d=>d.status=='Pending'&&hrs(d.since)>48).slice(0,3).forEach(d=>n.push({id:'d'+d.id,m:'Cell '+(d.cell||'')+' at '+d.site+' has been down for '+Math.floor(hrs(d.since)/24)+' days',r:['Admin','Manager','Coordinator'],c:'er',s:d.site}));
 NT.filter(x=>(x.mentions||[]).some(m=>m.id==me.id)&&x.uid!=me.id&&x.t>Date.now()-7*DAY).forEach(x=>n.push({id:'n'+x.id,m:x.by+' mentioned you in a handover note',r:[me.role],c:'ac',g:'handover'}));
 return n.filter(x=>x.r.includes(me.role))}
const NAV=[['home','Home','\u25E7'],['priority','Priority Board','\u2605'],['cm','CM Tracking','\u270E'],['pending','Pending','\u25D4'],['dcells','Down Cells','\u26A1'],['tparser','Ticket Parser','\u2726'],['sites','Sites','\u2316'],['thefts','Stolen Sites','\u26A0'],['insights','Insights','\u25ED'],['handover','Shift Handover','\u21C4'],['users','Users & Settings','\u263A','Admin,Manager'],['audit','Audit Log','\u2630','Admin']];
function go(p){if(p=='tparser')TPtried=false;page=p;tab=0;$('#drawer').classList.remove('on');draw()}
function draw(){if(!me)return login();setTimeout(sync,0);const nn=notes(),un=nn.filter(x=>!READ.has(x.id)).length;
$('#root').innerHTML=`<div id="app"><aside><div class="logo"><div class="bars"><i style="height:7px"></i><i style="height:12px"></i><i style="height:17px"></i><i style="height:22px"></i></div><b>ERA CM Control</b></div>${NAV.filter(n=>!n[3]||n[3].includes(me.role)).map(n=>`<a tabindex=0 class="${page==n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[2]}</span>${n[1]}</a>`).join('')}<div style="padding:14px 12px;font-size:11px;color:#7F93B4">Version 14 \u00B7 Home tables</div></aside>
<main><div class="top"><div class="grow"><input id="q" placeholder="Search sites, areas, teams   ( press / )" autocomplete="off" oninput="srch(this.value)" onfocus="srch(this.value)" onkeydown="if(event.key=='Enter')srchGo()"><div id="sr"></div></div>
<div style="position:relative"><button class="btn" onclick="$('#bell').style.display=$('#bell').style.display=='block'?'none':'block'">\uD83D\uDD14 ${un?'<b style="color:var(--er)">'+un+'</b>':''}</button><div id="bell" class="card">${nn.length?nn.map(x=>`<div class="n ${READ.has(x.id)?'':'u'}" onclick="rd('${x.id}');${x.g?`go('${x.g}')`:x.s?`openSite('${x.s}')`:''};draw()">${pill('\u2022',x.c)} ${x.m}</div>`).join(''):'<div class="mut">All clear</div>'}</div></div>
<button class="btn" onclick="const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark'">\u25D0 Theme</button>
<div><b>${me.name}</b><div class="mut" style="font-size:12px">${me.role}</div></div><button class="btn" onclick="out()">Log out</button></div><div id="pg"></div></main></div>`;
$('#pg').innerHTML=PG[page]();}
function out(){me=null;TP=null;TPtried=false;sessionStorage.removeItem('tk');draw()}
function bump(){clearTimeout(idle);if(me)idle=setTimeout(()=>{out();toast('Signed out after 15 minutes of inactivity')},9e5)}
['click','keydown'].forEach(e=>addEventListener(e,bump));
function login(m){$('#root').innerHTML=`<div class="login"><div class="l"><div class="row"><div class="bars"><i style="height:7px"></i><i style="height:12px"></i><i style="height:17px"></i><i style="height:22px"></i></div><b class="disp" style="font-size:20px">ERA CM Control</b></div><div><h1 style="font-size:46px;line-height:1.05">Every site.<br>Every visit.<br>One record.</h1><p style="color:#A9BAD6;max-width:380px">Corrective maintenance tracking for the duty team: feedback, pending sites, flapping cells and thefts, in one place.</p></div><small style="color:#7F93B4">Internal use only</small></div>
<div class="r"><div><h2 style="font-size:26px;margin-bottom:14px">${m?'Create account':'Sign in'}</h2>
${m?'<label>Full name</label><input id="rn"><br><br>':''}<label>Email</label><input id="em" type="email"><br><br><label>Password</label><input id="pw" type="password" onkeydown="if(event.key=='Enter')${m?'reg()':'sign()'}"><br><br>
${m?'<label>Role</label><select id="rr"><option>Shift Engineer</option><option>Coordinator</option><option>Manager</option></select><br><br>':''}
<button class="btn p" style="width:100%" onclick="${m?'reg()':'sign()'}">${m?'Register':'Sign in'}</button><p class="mut" id="msg" style="color:var(--er)"></p>
<a style="color:var(--acc);cursor:pointer" onclick="login(${!m})">${m?'I already have an account':'New here? Create an account'}</a>
</div></div></div>`}
async function sign(){const r=await api('/api/login','POST',{email:$('#em').value.trim().toLowerCase(),password:$('#pw').value});if(r.error)return $('#msg').textContent=r.error;sessionStorage.setItem('tk',r.token);me=r.user;rdInit();await load();page='home';bump();draw()}
async function reg(){const r=await api('/api/register','POST',{name:$('#rn').value,email:$('#em').value,password:$('#pw').value,role:$('#rr').value});if(r.error)return $('#msg').textContent=r.error;login();$('#msg').style.color='var(--ok)';$('#msg').textContent='Registered. The admin and manager were notified; you can sign in once approved.'}
function openSite(id){const s=S.find(x=>x.id==id);if(!s)return;const l=lv(id),pd=l.find(v=>v.status=='Pending'),th=TH.filter(t=>t.site==id);
$('#drawer').innerHTML=`<div class="row sp"><h2>${id}</h2><button class="btn s" onclick="$('#drawer').classList.remove('on')">Close</button></div><p class="mut">${X(s.area)} \u00B7 ${X(s.type)} \u00B7 ${X(s.access)}<br>Power: ${X(s.power)||'\u2014'} \u00B7 TX: ${X(s.tx)||'\u2014'}<br>Shared: ${X(s.shared)||'\u2014'} \u00B7 Owner: ${X(s.sharedOwned)||'\u2014'} \u00B7 Guest: ${X(s.guest)||'\u2014'}<br>${s.status?'Status: '+X(s.status)+' \u00B7 ':''}${X(s.vendor)}${s.address?'<br>'+X(s.address):''}${s.lat&&s.lng?`<br><a href="https://www.google.com/maps?q=${encodeURIComponent(s.lat)},${encodeURIComponent(s.lng)}" target="_blank" rel="noopener" style="color:var(--acc)">Open on map (${X(s.lat)}, ${X(s.lng)})</a>`:''}</p><div class="row">${pd?pill('Pending open','wa'):pill('No pending','ok')}${th.length?pill('Stolen \u00D7'+th.length,'er'):''}${l.length>2&&l[2].ts>NOW-30*DAY?pill('Repeat site','ac'):''}</div>
<h3 style="margin:18px 0 8px">Last visit</h3>${l[0]?`<div class="card" style="background:var(--soft)"><b>${l[0].team}</b> \u00B7 ${fd(l[0].ts)}<br>${l[0].reason} / ${l[0].action}<br>${aft(l[0].after)} ${st(l[0].status)}</div>`:'<p class="mut">No visits yet.</p>'}
<h3 style="margin:18px 0 8px">Last 3 visits</h3>${l.slice(0,3).map(v=>`<div class="n"><b>${fd(v.ts)}</b> ${v.team}<br>${v.reason} \u00B7 ${v.action}${v.sub?' \u00B7 '+X(v.sub):''}<br>${v.comments?'<span class="mut">'+X(v.comments)+'</span><br>':''}${st(v.status)} ${v.action=='Theft Issue'?pill('Theft','er'):''}</div>`).join('')||'<p class="mut">\u2014</p>'}
<div class="row" style="margin-top:16px"><button class="btn p" onclick="fb('${id}')">Add feedback</button><button class="btn" onclick="cmSite('${id}')">All visits of this site</button>${pd&&ed()?`<button class="btn" onclick="closeV(${pd.id})">Close pending</button>`:''}</div>`;$('#drawer').classList.add('on')}
function closeV(id){const v=V.find(x=>x.id==id);v.status='Closed';v.closed=Date.now();log('Closed pending',v.site);toast('Closed. CM Tracking updated.');$('#drawer').classList.remove('on');draw()}
function expM(){modal(`<h2>Export CM Tracking</h2><p class="mut">Choose the visit date range for the Excel file.</p><div class="row" style="margin-bottom:10px">${[['Today',0],['Last 7 days',7],['This month',-1],['Last month',-2]].map(x=>`<button class="btn s" onclick="rng(${x[1]})">${x[0]}</button>`).join('')}</div>
